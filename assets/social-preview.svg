<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="socialTitle socialDesc">
  <title id="socialTitle">Engineering Workbench — Ilya</title>
  <desc id="socialDesc">Dark social preview card: the name Ilya, the tagline Building useful software. Exploring systems. Automating things., and a schematic of a local Python, Linux, SQLite and Docker stack on a ThinkPad with Proxmox VE.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1114"/>
      <stop offset="0.55" stop-color="#0A0E11"/>
      <stop offset="1" stop-color="#0D1517"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.84" cy="0.44" r="0.58">
      <stop offset="0" stop-color="#2E7D63" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#2E7D63" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2E7D63" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridFine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 H 0 V 8" fill="none" stroke="#151E21" stroke-width="1"/>
    </pattern>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#1C272A" stroke-width="1"/>
    </pattern>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55C79A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#55C79A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#55C79A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#gridFine)" opacity="0.45"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <rect x="24.5" y="24.5" width="1231" height="591" rx="2" fill="none" stroke="#22302E"/>
  <path d="M24 60 V24 H60" fill="none" stroke="#55C79A" stroke-width="2"/>
  <path d="M1220 24 H1256 V60" fill="none" stroke="#3A4B47" stroke-width="2"/>
